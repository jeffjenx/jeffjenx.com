name: Generate Product Pages

# Runs whenever products.json changes on main.
# Also runnable manually from the Actions tab.
#
# Generates:
#   - /products/{id}/index.html  for each active product (24 pages currently)
#   - sitemap.xml                updated with all product URLs
#
# Then commits and pushes the generated files back to main.
# GitHub Pages picks up the commit automatically.

on:
  push:
    branches: [main]
    paths:
      - 'products.json'
  workflow_dispatch:

jobs:
  generate:
    name: Generate product pages + sitemap
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate product pages
        run: node tools/generate/index.js --clean

      - name: Generate sitemap
        run: node tools/generate/sitemap.js

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to commit — product pages already up to date."
          else
            PRODUCT_COUNT=$(git diff --staged --name-only | grep "products/" | wc -l | tr -d ' ')
            git commit -m "chore: regenerate product pages + sitemap [skip ci]

Generated by generate-product-pages workflow.
Trigger: products.json changed on main.
Pages updated: ${PRODUCT_COUNT} product pages + sitemap.xml"
            git push
          fi
